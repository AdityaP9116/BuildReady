name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Synchronize project
        run: uv sync --locked

      - name: Check
        run: uv run python scripts/check.py

      - name: Test
        run: uv run python -m unittest discover -s tests -v

      - name: Build
        run: uv run python scripts/build.py
